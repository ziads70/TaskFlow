<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TaskFlow - منصة عربية لتنظيم المهام وزيادة الإنتاجية"
    >

    <title>
        {% block title %}TaskFlow | إدارة المهام بسهولة{% endblock %}
    </title>

    <style>
        /* ==============================
           الإعدادات العامة
        ============================== */

        :root {
            --primary-color: #635bff;
            --primary-dark: #4c46d9;
            --primary-light: #eeeefe;

            --secondary-color: #17b897;
            --secondary-light: #e5faf5;

            --background-color: #f7f8fc;
            --surface-color: #ffffff;

            --text-color: #202336;
            --muted-color: #73778c;

            --border-color: #e6e8f0;
            --danger-color: #e5484d;
            --warning-color: #f2a93b;

            --shadow-sm: 0 4px 14px rgba(32, 35, 54, 0.06);
            --shadow-md: 0 12px 35px rgba(32, 35, 54, 0.10);

            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 28px;

            --container-width: 1180px;
            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--background-color);
            color: var(--text-color);
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
            line-height: 1.7;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .container {
            width: min(calc(100% - 32px), var(--container-width));
            margin-inline: auto;
        }

        .section {
            padding: 84px 0;
        }

        .section-header {
            max-width: 680px;
            margin: 0 auto 42px;
            text-align: center;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 7px 15px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary-color);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .section-title {
            margin-bottom: 12px;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            line-height: 1.3;
        }

        .section-description {
            color: var(--muted-color);
            font-size: 1.05rem;
        }

        .btn {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px 22px;
            border: 1px solid transparent;
            border-radius: 13px;
            transition:
                transform var(--transition),
                background-color var(--transition),
                border-color var(--transition),
                box-shadow var(--transition);
            font-weight: 700;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 10px 22px rgba(99, 91, 255, 0.24);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-outline {
            border-color: var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .icon {
            display: inline-grid;
            width: 22px;
            height: 22px;
            place-items: center;
            flex-shrink: 0;
        }

        /* ==============================
           الشريط العلوي
        ============================== */

        .site-header {
            position: sticky;
            z-index: 1000;
            top: 0;
            border-bottom: 1px solid rgba(230, 232, 240, 0.9);
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            transition: box-shadow var(--transition);
        }

        .site-header.scrolled {
            box-shadow: var(--shadow-sm);
        }

        .navbar {
            display: flex;
            min-height: 74px;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            flex-shrink: 0;
        }

        .brand-icon {
            display: grid;
            width: 43px;
            height: 43px;
            place-items: center;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    var(--primary-color),
                    #887fff
                );
            color: #ffffff;
            box-shadow: 0 9px 20px rgba(99, 91, 255, 0.25);
        }

        .brand-icon svg {
            width: 25px;
            height: 25px;
        }

        .brand-text {
            font-size: 1.28rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-text span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }

        .nav-link {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            padding: 8px 14px;
            border-radius: 11px;
            color: var(--muted-color);
            transition:
                color var(--transition),
                background-color var(--transition);
            font-weight: 600;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--surface-color);
            color: var(--text-color);
        }

        .menu-toggle svg {
            width: 23px;
            height: 23px;
        }

        .mobile-overlay {
            position: fixed;
            z-index: 998;
            inset: 74px 0 0;
            visibility: hidden;
            background: rgba(18, 20, 32, 0.44);
            opacity: 0;
            transition:
                opacity var(--transition),
                visibility var(--transition);
        }

        .mobile-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        /* ==============================
           الصفحة الرئيسية
        ============================== */

        .hero {
            position: relative;
            overflow: hidden;
            padding: 92px 0 78px;
        }

        .hero::before {
            position: absolute;
            top: -180px;
            right: -160px;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: rgba(99, 91, 255, 0.12);
            filter: blur(8px);
            content: "";
        }

        .hero::after {
            position: absolute;
            bottom: -190px;
            left: -150px;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            background: rgba(23, 184, 151, 0.11);
            content: "";
        }

        .hero-grid {
            position: relative;
            z-index: 1;
            display: grid;
            align-items: center;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 70px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 20px;
            padding: 8px 15px;
            border: 1px solid rgba(99, 91, 255, 0.15);
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .hero-title {
            max-width: 680px;
            margin-bottom: 20px;
            font-size: clamp(2.4rem, 5.4vw, 4.6rem);
            line-height: 1.13;
            letter-spacing: -2px;
        }

        .hero-title span {
            color: var(--primary-color);
        }

        .hero-description {
            max-width: 620px;
            margin-bottom: 30px;
            color: var(--muted-color);
            font-size: 1.14rem;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-note {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 28px;
            color: var(--muted-color);
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .hero-note span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .hero-note svg {
            width: 18px;
            height: 18px;
            color: var(--secondary-color);
        }

        .dashboard-preview {
            position: relative;
            padding: 18px;
            border: 1px solid rgba(230, 232, 240, 0.85);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(12px);
        }

        .dashboard-preview::before {
            position: absolute;
            z-index: -1;
            top: 35px;
            right: -35px;
            width: 110px;
            height: 110px;
            border-radius: 28px;
            background: var(--primary-color);
            opacity: 0.13;
            transform: rotate(18deg);
            content: "";
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 1.08rem;
            font-weight: 800;
        }

        .preview-date {
            color: var(--muted-color);
            font-size: 0.85rem;
        }

        .preview-progress {
            margin-bottom: 18px;
            padding: 17px;
            border-radius: 16px;
            background:
                linear-gradient(
                    135deg,
                    var(--primary-color),
                    #8179ff
                );
            color: #ffffff;
        }

        .progress-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .progress-value {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .progress-label {
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.25);
        }

        .progress-fill {
            width: 72%;
            height: 100%;
            border-radius: inherit;
            background: #ffffff;
        }

        .task-list {
            display: grid;
            gap: 10px;
        }

        .task-item {
            display: grid;
            align-items: center;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            padding: 13px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: #ffffff;
        }

        .task-check {
            display: grid;
            width: 23px;
            height: 23px;
            place-items: center;
            border: 2px solid var(--border-color);
            border-radius: 7px;
            color: #ffffff;
        }

        .task-check.completed {
            border-color: var(--secondary-color);
            background: var(--secondary-color);
        }

        .task-check svg {
            width: 14px;
            height: 14px;
        }

        .task-name {
            margin-bottom: 2px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .task-category {
            color: var(--muted-color);
            font-size: 0.76rem;
        }

        .task-status {
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .status-high {
            background: #fff0f0;
            color: var(--danger-color);
        }

        .status-medium {
            background: #fff6e6;
            color: #b77917;
        }

        .status-done {
            background: var(--secondary-light);
            color: #0d8f75;
        }

        /* ==============================
           الإحصائيات
        ============================== */

        .stats {
            position: relative;
            z-index: 2;
            margin-top: -12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .overview-section {
            padding: 24px 0 54px;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(210px, 1fr));
            gap: 18px;
        }

        .overview-card {
            padding: 24px;
            border: 1px solid rgba(230, 232, 240, 0.90);
            border-radius: var(--radius-md);
            background: linear-gradient(180deg, #ffffff, #fbfbff);
            box-shadow: var(--shadow-sm);
        }

        .overview-card .overview-icon {
            display: inline-grid;
            width: 46px;
            height: 46px;
            place-items: center;
            margin-bottom: 16px;
            border-radius: 14px;
            background: var(--primary-light);
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        .overview-card h3 {
            margin-bottom: 8px;
            font-size: 1.04rem;
        }

        .overview-card p {
            color: var(--muted-color);
            font-size: 0.88rem;
            line-height: 1.8;
        }

        .overview-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            color: var(--primary-color);
            font-size: 0.84rem;
            font-weight: 800;
        }

        .stat-card {
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--surface-color);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .stat-number {
            margin-bottom: 4px;
            color: var(--primary-color);
            font-size: 1.9rem;
            font-weight: 800;
        }

        .stat-label {
            color: var(--muted-color);
            font-size: 0.92rem;
        }

        /* ==============================
           المميزات
        ============================== */

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .feature-card {
            padding: 28px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--surface-color);
            transition:
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition);
        }

        .feature-card:hover {
            border-color: rgba(99, 91, 255, 0.30);
            box-shadow: var(--shadow-md);
            transform: translateY(-6px);
        }

        .feature-icon {
            display: grid;
            width: 54px;
            height: 54px;
            margin-bottom: 20px;
            place-items: center;
            border-radius: 16px;
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .feature-icon.green {
            background: var(--secondary-light);
            color: var(--secondary-color);
        }

        .feature-icon.orange {
            background: #fff5e5;
            color: var(--warning-color);
        }

        .feature-icon svg {
            width: 27px;
            height: 27px;
        }

        .feature-title {
            margin-bottom: 10px;
            font-size: 1.12rem;
        }

        .feature-description {
            color: var(--muted-color);
            font-size: 0.94rem;
        }

        /* ==============================
           دعوة التسجيل
        ============================== */

        .cta {
            padding: 30px 0 84px;
        }

        .cta-box {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            padding: 48px;
            border-radius: var(--radius-lg);
            background:
                linear-gradient(
                    135deg,
                    #5149eb,
                    #756eff
                );
            color: #ffffff;
            box-shadow: 0 22px 50px rgba(99, 91, 255, 0.25);
        }

        .cta-box::after {
            position: absolute;
            top: -90px;
            left: -45px;
            width: 220px;
            height: 220px;
            border: 38px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            content: "";
        }

        .cta-content {
            position: relative;
            z-index: 1;
            max-width: 650px;
        }

        .cta-title {
            margin-bottom: 10px;
            font-size: clamp(1.65rem, 4vw, 2.45rem);
        }

        .cta-description {
            color: rgba(255, 255, 255, 0.82);
        }

        .cta .btn {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            background: #ffffff;
            color: var(--primary-color);
        }

        /* ==============================
           التذييل
        ============================== */

        .site-footer {
            border-top: 1px solid var(--border-color);
            background: #ffffff;
        }

        .footer-main {
            display: grid;
            padding: 55px 0 36px;
            grid-template-columns: 1.4fr repeat(3, 0.7fr);
            gap: 44px;
        }

        .footer-about {
            max-width: 360px;
        }

        .footer-description {
            margin-top: 18px;
            color: var(--muted-color);
            font-size: 0.94rem;
        }

        .footer-social {
            display: flex;
            gap: 9px;
            margin-top: 20px;
        }

        .social-link {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border: 1px solid var(--border-color);
            border-radius: 11px;
            color: var(--muted-color);
            transition:
                color var(--transition),
                background-color var(--transition),
                border-color var(--transition),
                transform var(--transition);
        }

        .social-link:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 19px;
            height: 19px;
        }

        .footer-title {
            margin-bottom: 18px;
            font-size: 1rem;
        }

        .footer-links {
            display: grid;
            gap: 11px;
            list-style: none;
        }

        .footer-link {
            color: var(--muted-color);
            font-size: 0.92rem;
            transition:
                color var(--transition),
                padding var(--transition);
        }

        .footer-link:hover {
            padding-right: 5px;
            color: var(--primary-color);
        }

        .footer-bottom {
            display: flex;
            min-height: 72px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--muted-color);
            font-size: 0.88rem;
        }

        .footer-bottom-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .footer-bottom-links a:hover {
            color: var(--primary-color);
        }

        /* ==============================
           التصميم المتجاوب
        ============================== */

        @media (max-width: 992px) {
            .nav-links {
                position: fixed;
                z-index: 999;
                top: 74px;
                right: -100%;
                display: flex;
                width: min(310px, 86%);
                height: calc(100vh - 74px);
                align-items: stretch;
                flex-direction: column;
                gap: 4px;
                padding: 22px;
                background: #ffffff;
                box-shadow: -12px 20px 30px rgba(32, 35, 54, 0.12);
                transition: right 0.3s ease;
            }

            .nav-links.open {
                right: 0;
            }

            .nav-link {
                width: 100%;
                min-height: 48px;
            }

            .menu-toggle {
                display: grid;
                place-items: center;
            }

            .nav-actions .btn-outline {
                display: none;
            }

            .hero-grid {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-description {
                margin-inline: auto;
            }

            .hero-actions,
            .hero-note {
                justify-content: center;
            }

            .dashboard-preview {
                width: min(100%, 620px);
                margin-inline: auto;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .footer-main {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 680px) {
            .container {
                width: min(calc(100% - 24px), var(--container-width));
            }

            .section {
                padding: 65px 0;
            }

            .navbar {
                min-height: 68px;
            }

            .mobile-overlay {
                inset: 68px 0 0;
            }

            .nav-links {
                top: 68px;
                height: calc(100vh - 68px);
            }

            .nav-actions .btn-primary {
                display: none;
            }

            .hero {
                padding: 68px 0 58px;
            }

            .hero-title {
                letter-spacing: -1px;
            }

            .hero-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .hero-actions .btn {
                width: 100%;
            }

            .hero-note {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .dashboard-preview {
                padding: 13px;
                border-radius: 20px;
            }

            .task-item {
                grid-template-columns: auto 1fr;
            }

            .task-status {
                grid-column: 2;
                justify-self: start;
            }

            .stats-grid,
            .features-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 20px;
            }

            .cta-box {
                align-items: stretch;
                flex-direction: column;
                padding: 34px 25px;
                text-align: center;
            }

            .cta .btn {
                width: 100%;
            }

            .footer-main {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .footer-bottom {
                align-items: flex-start;
                flex-direction: column;
                justify-content: center;
                padding: 20px 0;
            }
        }

        /* تحسين الوصول */
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(99, 91, 255, 0.28);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="site-header" id="siteHeader">
